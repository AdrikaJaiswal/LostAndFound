
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item | Lost & Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 700px;">
            <div class="card-body p-4">
                <h2 class="mb-4">Edit Your Item</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Item Name</label>
                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ item.title }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Item Type</label>
                        <select name="item_type" class="form-select" required>
                            <option value="Lost" {% if item.item_type == 'Lost' %}selected{% endif %}>Lost</option>
                            <option value="Found" {% if item.item_type == 'Found' %}selected{% endif %}>Found</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            required
                        >{{ item.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date Reported</label>
                        <input
                            type="date"
                            name="date_reported"
                            class="form-control"
                            value="{{ item.date_reported }}"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="/student/my-uploads" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
