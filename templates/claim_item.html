
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claim Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-body p-4">
                <h2>Claim This Item</h2>
                <p class="text-muted">
                    Explain how you can identify and prove ownership of this item.
                </p>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <label for="proof_description" class="form-label">
                        Proof of Ownership
                    </label>
                    <textarea
                        id="proof_description"
                        name="proof_description"
                        class="form-control mb-3"
                        rows="5"
                        required
                        placeholder="Describe identifying details..."
                    ></textarea>

                    <button type="submit" class="btn btn-primary">
                        Submit Claim
                    </button>
                    <a href="{{ url_for('browse_items') }}"
                       class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
